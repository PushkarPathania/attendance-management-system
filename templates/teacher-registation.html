<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Registration Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/teacher.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/trust-theme.css') }}">
</head>
<body>

<div class="page-header">
    <h1><i class="fas fa-chalkboard-teacher"></i> Teacher Registration</h1>
</div>

<div class="form-container" id="register-form">
    <h2>Create Your Account</h2>
  <form action="/teacher-register" method="post">
    <label for="reg-name">Full Name</label>
    <input type="text" id="reg-name" name="reg-name" placeholder="Enter your full name" required>

  <label for="reg-email">Email Address</label>
  <input type="email" id="reg-email" name="reg-email" placeholder="Enter your email" required>

  <label for="reg-mobile">Mobile Number</label>
  <input type="tel" id="reg-mobile" name="reg-mobile" placeholder="Enter mobile number" required>

  <label for="reg-id">Teacher ID</label>
  <input type="text" id="reg-id" name="reg-id" placeholder="Enter Teacher ID" required>

  <label for="reg-branch">Branch</label>
  <select id="reg-branch" name="reg-branch" required>
    <option value="">Select Branch</option>
    <option value="Computer Enginnering">Computer Enginnering</option>
    <option value="Electrical Enginnering">Electrical Enginnering</option>
    <option value="Mechanical Enginnering">Mechanical Enginnering</option>
    <option value="Instrumentation Enginnering">Instrumentation Enginnering</option>
    <option value="Electronic and Communication Enginnering">Electronic and Communication Enginnering</option>
  </select>

  <label for="reg-semester">Semester</label>
  <select id="reg-semester" name="reg-semester" required>
    <option value="">Select Semester</option>
    <option value="1">1st Semester</option>
    <option value="2">2nd Semester</option>
    <option value="3">3rd Semester</option>
    <option value="4">4th Semester</option>
    <option value="5">5th Semester</option>
    <option value="6">6th Semester</option>
  </select>

  <div id="subject-container" style="display: none;">
    <label for="reg-subject">Subject</label>
    <select id="reg-subject" name="reg-subject">
      <option value="">Select Subject</option>
      <option value="Applied Math-1">Applied Math-1</option>
      <option value="Applied Physics-1">Applied Physics-1</option>
      <option value="Applied Chemistry">Applied Chemistry</option>
      <option value="Engineering Graphics">Engineering Graphics</option>
      <option value="CSIE">CSIE</option>
      <option value="SCA">SCA</option>
      <option value="Sports & Yoga">Sports & Yoga</option>
      <option value="Workshops">Workshops</option>
    </select>
  </div>

  <label for="reg-designation">Designation</label>
  <select id="reg-designation" name="reg-designation" required>
    <option value="">Select Designation</option>
    <option value="Lecturer">Lecturer</option>
    <option value="Senior Lecturer">Senior Lecturer</option>
    <option value="Assistant Professor">Assistant Professor</option>
    <option value="Professor">Professor</option>
  </select>

  <label for="reg-gender">Gender</label>
  <select id="reg-gender" name="reg-gender" required>
    <option value="">Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    <option value="Other">Other</option>
  </select>

  <label for="reg-dob">Date of Birth</label>
  <input type="date" id="reg-dob" name="reg-dob" required>

  <label for="reg-password">Password</label>
  <input type="password" id="reg-password" name="reg-password" placeholder="Create a password" required>

  <label for="reg-confirm-password">Confirm Password</label>
  <input type="password" id="reg-confirm-password" name="reg-confirm-password" placeholder="Confirm your password" required>

  <div class="terms-checkbox">
    <label style="display: flex; align-items: center; justify-content: space-between;">
      I agree to the terms and conditions
      <input type="checkbox" id="reg-terms" name="reg-terms" required style="width: auto; margin-left: 10px;">
    </label>
  </div>

    <button type="submit">Register</button>
  </form>
  <div class="toggle">
    <a href="index.html">
      <i class="fas fa-arrow-left"></i> Back to Home Page
    </a>
  </div>
</div>

<script>
  document.getElementById('reg-semester').addEventListener('change', function() {
    const subjectContainer = document.getElementById('subject-container');
    const subjectSelect = document.getElementById('reg-subject');
    if (this.value === '1') {
      subjectContainer.style.display = 'block';
      subjectSelect.required = true;
    } else {
      subjectContainer.style.display = 'none';
      subjectSelect.required = false;
      subjectSelect.value = '';
    }
  });
</script>
</body>
</html>
