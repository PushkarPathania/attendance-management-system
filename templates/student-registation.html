<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/registration.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/trust-theme.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Main Registration Container -->
    <div class="registration-container">
        <div class="header">
            <h1><i class="fas fa-user-graduate"></i> Student Registration</h1>
            <h2>Create Your Account</h2>
        </div>

        <form action="{{ url_for('student_registration') }}" method="post" id="registrationForm">
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!-- Student ID -->
            <div class="form-group">
                <label for="boardRollNo">Board Roll-No</label>
                <input type="text" id="boardRollNo" name="boardRollNo" placeholder="Enter your Board Roll-No" required>
            </div>

            <!-- Branch Dropdown -->
            <div class="form-group">
                <label for="reg-branch">Branch</label>
                <select id="reg-branch" name="reg-branch" required>
                    <option value="">Select Branch</option>
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Electrical Engineering">Electrical Engineering</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                    <option value="Instrumentation Engineering">Instrumentation Engineering</option>
                    <option value="Electronics & Communication Engineering">Electronics & Communication Engineering</option>
                </select>
            </div>

            <!-- Semester Dropdown -->
            <div class="form-group">
                <label for="reg-semester">Semester</label>
                <select id="reg-semester" name="reg-semester" required>
                    <option value="">Select Semester</option>
                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                </select>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password"
                    required>
            </div>

            <!-- Terms and Conditions Checkbox -->
            <div class="terms-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions</label>
            </div>

            <!-- Register Button -->
            <button type="submit" class="submit-btn">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home Page
        </a>
    </div>


</body>

</html>
