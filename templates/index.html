<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System - Login Portal</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/trust-theme.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-user-clock"></i> Attendance Management System</h1>
            <p class="subtitle">Welcome to the Academic Portal</p>
        </header>
        <div class="login-container">
            <div class="login-box teacher-login">
                <div class="login-icon">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <h2>Teacher Portal</h2>
                <form action="/teacher-login" method="post" class="login-form">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="Teacher Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Login as Teacher
                    </button>
                    <div class="form-footer">
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                </form>
            </div>
            <div class="login-box student-login">
                <div class="login-icon">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h2>Student Portal</h2>
                <form action="/login" method="post" class="login-form">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="Student Email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Login as Student
                    </button>
                    <div class="form-footer">
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="registration-links">
            <div class="reg-box">
                <i class="fas fa-user-tie"></i>
                <h3>New Teacher?</h3>
                <p>Register as a faculty member</p>
                <a href="{{ url_for('teacher_register') }}" class="register-btn">
                    <i class="fas fa-pencil-alt"></i> Teacher Registration
                </a>
            </div>
            <div class="reg-box">
                <i class="fas fa-user-plus"></i>
                <h3>New Student?</h3>
                <p>Create your student account </p>
                <a href="{{ url_for('student_registration') }}" class="register-btn">
                    <i class="fas fa-pencil-alt"></i> Student Registration
                </a>
            </div>
        </div>
    </div>
</body>
</html>
