<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System - Login Portal</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/trust-theme.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-user-clock"></i> Attendance Management System</h1>
            <p class="subtitle">Welcome to the Academic Portal</p>
        </header>
        <div class="login-container">
            <div class="login-box admin-login" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: 3px solid #667eea;">
                <div class="login-icon" style="color: white;">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2 style="color: white;">Admin Portal</h2>
                <p style="color: rgba(255,255,255,0.9); text-align: center; margin-bottom: 20px; font-size: 0.9rem;">Manage Teachers & System</p>
                <a href="{{ url_for('admin_login') }}" class="login-btn" style="background: white; color: #667eea; border: none; text-decoration: none; display: inline-block; width: 100%; text-align: center;">
                    <i class="fas fa-sign-in-alt"></i> Go to Admin Login
                </a>
            </div>
            <div class="login-box teacher-login" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: 3px solid #667eea;">
                <div class="login-icon" style="color: white;">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <h2 style="color: white;">Teacher Portal</h2>
                <p style="color: rgba(255,255,255,0.9); text-align: center; margin-bottom: 20px; font-size: 0.9rem;">Access your classroom</p>
                <a href="{{ url_for('teacher_login') }}" class="login-btn" style="background: white; color: #667eea; border: none; text-decoration: none; display: inline-block; width: 100%; text-align: center;">
                    <i class="fas fa-sign-in-alt"></i> Teacher Login
                </a>
            </div>
            <div class="login-box student-login" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: 3px solid #667eea;">
                <div class="login-icon" style="color: white;">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h2 style="color: white;">Student Portal</h2>
                <p style="color: rgba(255,255,255,0.9); text-align: center; margin-bottom: 20px; font-size: 0.9rem;">View your attendance</p>
                <a href="{{ url_for('student_login') }}" class="login-btn" style="background: white; color: #667eea; border: none; text-decoration: none; display: inline-block; width: 100%; text-align: center;">
                    <i class="fas fa-sign-in-alt"></i> Student Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
